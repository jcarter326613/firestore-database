name: Release

on:
    push:
        branches: [main]

permissions: {}

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    select-mode:
        name: Select release mode
        runs-on: ubuntu-latest
        outputs:
            mode: ${{ steps.select-mode.outputs.mode }}
            publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - run: corepack enable
            - run: pnpm install --frozen-lockfile
            - id: select-mode
              uses: changesets/action/select-mode@v2

    version:
        name: Create version pull request
        needs: select-mode
        if: needs.select-mode.outputs.mode == 'version'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - run: corepack enable
            - run: pnpm install --frozen-lockfile
            - name: Create GitHub App token
              id: app-token
              uses: actions/create-github-app-token@v3
              with:
                  app-id: ${{ vars.RELEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-pull-requests: write
            - uses: changesets/action/version@v2
              with:
                  github-token: ${{ steps.app-token.outputs.token }}
                  script: pnpm changeset version

    pack:
        name: Build release package
        needs: select-mode
        if: needs.select-mode.outputs.mode == 'publish'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        outputs:
            pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - run: corepack enable
            - run: pnpm install --frozen-lockfile
            - run: pnpm run typecheck
            - run: pnpm test
            - run: pnpm run build
            - id: pack
              uses: changesets/action/pack@v2
              with:
                  publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

    publish:
        name: Publish release
        needs: [select-mode, pack]
        if: needs.select-mode.outputs.mode == 'publish'
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org
            - run: corepack enable
            - run: pnpm install --frozen-lockfile
            - run: npm install --global npm@^11.5.1
            - uses: changesets/action/publish@v2
              with:
                  pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
                  create-github-releases: true
